apiVersion: v1
kind: Service
metadata:
  name: kvstore-headless
  namespace: vector-stack
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: kvstore
  ports:
    - name: resp
      port: 8050
      targetPort: resp
---
apiVersion: v1
kind: Service
metadata:
  name: kvstore
  namespace: vector-stack
spec:
  selector:
    app.kubernetes.io/name: kvstore
  ports:
    - name: resp
      port: 8050
      targetPort: resp
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kvstore
  namespace: vector-stack
spec:
  serviceName: kvstore-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kvstore
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kvstore
        app.kubernetes.io/part-of: vector-stack
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: Unconfined
      containers:
        - name: kvstore
          image: kvstore:dev
          imagePullPolicy: Never
          args: ["--config", "/etc/kvstore/kvstore.ini"]
          workingDir: /data
          ports:
            - name: resp
              containerPort: 8050
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: resp
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 120
          readinessProbe:
            tcpSocket:
              port: resp
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: resp
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/kvstore
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: kvstore-config
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi