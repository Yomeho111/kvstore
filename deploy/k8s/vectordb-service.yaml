apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vectordb-model-cache
  namespace: vector-stack
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vectordb-service
  namespace: vector-stack
spec:
  selector:
    app.kubernetes.io/name: vectordb-service
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vectordb-service
  namespace: vector-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vectordb-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vectordb-service
        app.kubernetes.io/part-of: vector-stack
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vectordb-service
          image: vectordb-service:dev
          imagePullPolicy: Never
          args:
            - --listen
            - 0.0.0.0:50051
            - --server-config
            - /etc/vectordb/server_config.json
            - --model
            - $(MODEL_NAME)
          env:
            - name: MODEL_NAME
              valueFrom:
                configMapKeyRef:
                  name: vectordb-service-config
                  key: model-name
            - name: HF_HOME
              value: /cache/huggingface
          ports:
            - name: grpc
              containerPort: 50051
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 6Gi
          startupProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 180
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          volumeMounts:
            - name: model-cache
              mountPath: /cache
            - name: config
              mountPath: /etc/vectordb
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: vectordb-model-cache
        - name: config
          configMap:
            name: vectordb-service-config
        - name: tmp
          emptyDir: {}