syntax = "proto3";

package vectordb.kvstore.com;

message VsetRequest {
    string text = 1;
}

message VsearchRequest {
    int32 topk = 1;
    float threshold = 2;
    string text = 3;
}

message VsetResponse {
    string uuid = 1;
}

message VsearchResponse {
    repeated string uuids = 1;
}


message SetRequest {
    string uuid = 1;
    string text = 2;
}

message GetRequest {
    string uuid = 1;
}

message SetResponse {
    bool ok = 1;
}

message GetResponse {
    string text = 1;
}

service Rag {
    rpc Vset (VsetRequest) returns (VsetResponse);
    rpc Vsearch (VsearchRequest) returns (VsearchResponse);
    rpc Set (SetRequest) returns (SetResponse);
    rpc Get (GetRequest) returns (GetResponse);
}
