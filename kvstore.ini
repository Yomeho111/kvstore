; kvstore configuration.
;
; Pass with:  kvstore --config /path/to/kvstore.ini
; When --config is omitted, ./kvstore.ini is used.
;
; Unknown sections, unknown keys and invalid values are rejected at startup
; rather than ignored, so a typo cannot silently change the server's role.

[server]
; Base listening port. The server binds this port and the KVSTORE_PORT_NUM - 1
; ports after it (KVSTORE_PORT_NUM is a compile-time CMake option).
port = 8050

; error | warn | info | debug
log_level = info

[persistence]
; aof = append-only log, rdb = point-in-time snapshot on SIGUSR1
mode = aof

[replication]
; standalone = no replication
; master     = accept a replica over RDMA and stream updates to it
; slave      = connect to master_ip:master_port and apply what it sends
role = standalone

; Required when role = slave. Must be an address on an RDMA-capable interface.
; master_ip = 10.0.0.4

; The master's RDMA port.
master_port = 20000
